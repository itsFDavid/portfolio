server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve custom 404.html for any missing route
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Long cache for static assets
    location ~* \.(css|js|webp|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sitemap and robots: no cache
    location = /sitemap-index.xml {
        types { application/xml xml; }
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /sitemap-0.xml {
        types { application/xml xml; }
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Pretty 404s for everything else, including directory requests
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Hide hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
