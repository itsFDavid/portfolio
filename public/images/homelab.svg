<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00cc6a" stop-opacity="0.7" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" />
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#bg-grad)" />
  <rect width="800" height="400" fill="url(#grid)" opacity="0.5" />

  <g font-family="ui-monospace, 'JetBrains Mono', monospace">
    <text x="40" y="50" fill="#00ff88" font-size="11" letter-spacing="2" opacity="0.7">HOMELAB</text>
    <text x="40" y="78" fill="white" font-size="22" font-weight="700">proxmox-host</text>
    <text x="40" y="100" fill="#64748b" font-size="10">8 VLANs · 12 VMs · 1 LXC · k3s</text>
  </g>

  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="60" height="200" rx="4" fill="#0f172a" stroke="#00ff88" stroke-width="1.5" />
    <rect x="6" y="10" width="48" height="8" rx="1" fill="#1e293b" />
    <circle cx="30" cy="35" r="2" fill="#00ff88" />
    <text x="30" y="50" fill="#94a3b8" font-size="6" text-anchor="middle" font-family="ui-monospace, monospace">1U</text>

    <g stroke="#00ff88" stroke-width="0.8" fill="none">
      <line x1="30" y1="60" x2="30" y2="80" />
      <rect x="10" y="80" width="40" height="14" rx="1" fill="#1e293b" />
      <text x="30" y="90" fill="#94a3b8" font-size="5" text-anchor="middle" font-family="ui-monospace, monospace">CPU</text>

      <line x1="30" y1="100" x2="30" y2="120" />
      <rect x="10" y="120" width="40" height="14" rx="1" fill="#1e293b" />
      <text x="30" y="130" fill="#94a3b8" font-size="5" text-anchor="middle" font-family="ui-monospace, monospace">RAM</text>

      <line x1="30" y1="140" x2="30" y2="160" />
      <rect x="10" y="160" width="40" height="14" rx="1" fill="#1e293b" />
      <text x="30" y="170" fill="#94a3b8" font-size="5" text-anchor="middle" font-family="ui-monospace, monospace">SSD</text>
    </g>

    <g fill="#00ff88" opacity="0.7">
      <circle cx="0" cy="40" r="2" />
      <circle cx="0" cy="90" r="2" />
      <circle cx="0" cy="140" r="2" />
      <circle cx="0" cy="180" r="2" />
    </g>
  </g>

  <g transform="translate(40, 160)" font-family="ui-monospace, 'JetBrains Mono', monospace">
    <text x="0" y="0" fill="#00ff88" font-size="9" letter-spacing="1.5" opacity="0.7">VLAN SEGMENTS</text>

    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="120" height="20" rx="3" fill="#0f172a" stroke="#475569" stroke-width="0.5" />
      <circle cx="10" cy="10" r="2.5" fill="#00ff88" />
      <text x="20" y="13" fill="white" font-size="9">VLAN 10 · ISVERCEO</text>
    </g>
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="120" height="20" rx="3" fill="#0f172a" stroke="#475569" stroke-width="0.5" />
      <circle cx="10" cy="10" r="2.5" fill="#10b981" />
      <text x="20" y="13" fill="white" font-size="9">VLAN 80 · K3S</text>
    </g>
    <g transform="translate(130, 16)">
      <rect x="0" y="0" width="120" height="20" rx="3" fill="#0f172a" stroke="#475569" stroke-width="0.5" />
      <circle cx="10" cy="10" r="2.5" fill="#3b82f6" />
      <text x="20" y="13" fill="white" font-size="9">VLAN 50 · MGMT</text>
    </g>
    <g transform="translate(130, 42)">
      <rect x="0" y="0" width="120" height="20" rx="3" fill="#0f172a" stroke="#475569" stroke-width="0.5" />
      <circle cx="10" cy="10" r="2.5" fill="#a855f7" />
      <text x="20" y="13" fill="white" font-size="9">VLAN 100 · OBS</text>
    </g>
    <g transform="translate(260, 16)">
      <rect x="0" y="0" width="120" height="20" rx="3" fill="#0f172a" stroke="#475569" stroke-width="0.5" />
      <circle cx="10" cy="10" r="2.5" fill="#f59e0b" />
      <text x="20" y="13" fill="white" font-size="9">VLAN 40 · GUAC</text>
    </g>
    <g transform="translate(260, 42)">
      <rect x="0" y="0" width="120" height="20" rx="3" fill="#0f172a" stroke="#475569" stroke-width="0.5" />
      <text x="20" y="13" fill="#64748b" font-size="9">+ 3 more...</text>
    </g>
  </g>

  <g font-family="ui-monospace, monospace">
    <text x="40" y="350" fill="#64748b" font-size="9" letter-spacing="1.5" opacity="0.7">INFRASTRUCTURE AUDIT 2026</text>
    <text x="760" y="350" fill="#00ff88" font-size="9" text-anchor="end" font-weight="700" opacity="0.8">→ itsfdavid.com</text>
  </g>

  <g stroke="url(#primary-grad)" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 40 130 Q 250 130 470 180" />
    <path d="M 40 195 Q 250 195 470 200" />
  </g>
</svg>
